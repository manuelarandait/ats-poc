parameters:
    # Contracts between bounded contexts: event name on the wire => the class the
    # *consuming* context owns to read it. Publishers and consumers never share classes.
    app.event_consumers:
        recruitment.job_application.submitted: App\Screening\Application\ScreenCv\JobApplicationSubmitted
        screening.cv_screened: App\Recruitment\Application\CompleteJobApplicationScreening\CvScreened
        screening.cv_screening_failed: App\Recruitment\Application\FailJobApplicationScreening\CvScreeningFailed

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Use cases implement our own marker interfaces (no framework in Application);
    # this is the only place that ties them to Messenger buses.
    _instanceof:
        App\Shared\Domain\Bus\Command\CommandHandler:
            tags: [{ name: messenger.message_handler, bus: command.bus }]
        App\Shared\Domain\Bus\Event\DomainEventSubscriber:
            tags: [{ name: messenger.message_handler, bus: event.bus }]

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

when@test:
    services:
        # Entry points used by integration tests before any controller exists.
        App\Shared\Domain\Bus\Command\CommandBus:
            alias: App\Shared\Infrastructure\Bus\Messenger\MessengerCommandBus
            public: true
