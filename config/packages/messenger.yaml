framework:
    messenger:
        failure_transport: failed

        default_bus: command.bus
        buses:
            command.bus:
                middleware:
                    - doctrine_transaction
            query.bus: ~
            event.bus:
                default_middleware:
                    allow_no_handlers: true

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                # JSON on the wire, the event name is the contract (see app.event_consumers)
                serializer: App\Shared\Infrastructure\Bus\Messenger\JsonEventSerializer
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'

        # Only events that cross a bounded context go through RabbitMQ (handled by
        # the worker, never inside the HTTP request). The rest stay in-process.
        routing:
            App\Recruitment\Domain\JobApplication\Event\JobApplicationSubmitted: async
            App\Screening\Domain\Event\CvScreened: async
            App\Screening\Domain\Event\CvScreeningFailed: async

when@test:
    framework:
        messenger:
            transports:
                # serialize=true: tests go through the same JSON contract as RabbitMQ
                async:
                    dsn: 'in-memory://?serialize=true'
                    # Same number of retries, without waiting for the back-off
                    retry_strategy: { delay: 0 }
                failed: 'in-memory://'
