# Authentication is an edge concern: it lives here and in Infrastructure/Http,
# never in the domain or the use cases.
#
#   public     /jobs…          candidates apply without an account
#   recruiter  /applications…  requires ROLE_RECRUITER
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Demo account kept in config (hashed): no users table for a PoC.
        # Credentials are shown on the login page and in the README.
        recruiters:
            memory:
                users:
                    recruiter@ats.test:
                        password: '$2y$13$C3KrtjbYhBmzcwQ3P0zOse0BTMw7Mtu1F81dKCQE7gFiZGqDbuE2m' # "recruiter"
                        roles: [ROLE_RECRUITER]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: recruiters
            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
                username_parameter: email
                password_parameter: password
                default_target_path: applications_index # unless a protected page was requested first
            # Brute-force protection: 5 failed sign-ins per minute for an email + IP pair.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
                storage_service: app.rate_limiter.storage
            logout:
                path: /logout
                target: jobs_index
                enable_csrf: true

    # Only the *first* matching rule is applied.
    access_control:
        - { path: ^/applications, roles: ROLE_RECRUITER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
