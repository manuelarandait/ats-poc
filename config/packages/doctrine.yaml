doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        # Value objects <-> columns. Keeps the domain free of ORM code.
        types:
            job_application_id: App\Recruitment\Infrastructure\Persistence\Doctrine\Type\JobApplicationIdType
            job_offer_id: App\Recruitment\Infrastructure\Persistence\Doctrine\Type\JobOfferIdType
            full_name: App\Recruitment\Infrastructure\Persistence\Doctrine\Type\FullNameType
            email: App\Recruitment\Infrastructure\Persistence\Doctrine\Type\EmailType
            phone: App\Recruitment\Infrastructure\Persistence\Doctrine\Type\PhoneType
            cv_text: App\Recruitment\Infrastructure\Persistence\Doctrine\Type\CvTextType
            notes: App\Recruitment\Infrastructure\Persistence\Doctrine\Type\NotesType
            ai_score: App\Recruitment\Infrastructure\Persistence\Doctrine\Type\AiScoreType
            skill_matches: App\Recruitment\Infrastructure\Persistence\Doctrine\Type\SkillMatchesType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Recruitment:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Recruitment/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Recruitment\Domain'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
