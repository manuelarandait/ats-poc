x-php: &php
  build: .
  image: ats-poc-php
  volumes:
    - ./:/app
  environment:
    DATABASE_URL: postgresql://app:app@database:5432/app?serverVersion=16&charset=utf8
    MESSENGER_TRANSPORT_DSN: amqp://guest:guest@rabbitmq:5672/%2f/messages
  depends_on:
    database:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  app:
    <<: *php
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      # Every 2 s while starting (make init waits for it), then every 30 s so
      # the check doesn't flood the logs.
      start_period: 60s
      start_interval: 2s
      interval: 30s

  worker:
    <<: *php
    command: ["php", "bin/console", "messenger:consume", "async", "-vv", "--time-limit=3600"]
    restart: unless-stopped
    healthcheck:
      disable: true

  database:
    image: postgres:16-alpine
    # Published for GUI clients (TablePlus, DBeaver…): localhost:5433, app / app.
    # 5433 avoids clashing with a PostgreSQL already running on the host.
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app", "-U", "app"]
      interval: 2s
      retries: 30
    volumes:
      - database_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30

volumes:
  database_data:
